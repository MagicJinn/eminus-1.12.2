plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle'
}

apply from: rootProject.file('cleanroom/rfg-helpers.gradle')

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName = propertyString('mod_id')
}

def useJava25 = propertyBool('use_java25_bytecode')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(useJava25 ? 25 : (propertyBool('use_modern_java_syntax') ? 16 : 8))
        vendor = JvmVendorSpec.AZUL
    }
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set(propertyString('mapping_channel'))
    mcpMappingVersion.set(propertyString('mapping_version'))
    useDependencyAccessTransformers.set(propertyBool('use_dependency_at_files'))
    username.set(propertyString('minecraft_username'))
    extraTweakClasses.addAll(propertyStringList('extra_tweak_classes'))
    extraRunJvmArguments.addAll('-ea:' + group)
    extraRunJvmArguments.addAll(propertyStringList('extra_jvm_args'))
}

repositories {
    maven {
        name = 'CleanroomMC Maven'
        url = 'https://maven.cleanroommc.com'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

configurations {
    vetusEmbeddedLibs
}

dependencies {
    if (useJava25) {
        implementation project(':core')
        implementation 'org.joml:joml:1.10.8'
        // Core uses slf4j-api; Forge/Cleanroom do not ship an SLF4J binding for mod code.
        vetusEmbeddedLibs 'org.slf4j:slf4j-simple:2.0.16'
        implementation 'org.xerial:sqlite-jdbc:3.47.2.0'
        implementation 'io.airlift:aircompressor:0.27'
        if (propertyBool('use_mixins')) {
            compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
            annotationProcessor "net.fabricmc:sponge-mixin:${mixin_version}"
        }
    }

    if (propertyBool('use_modern_java_syntax') && !useJava25) {
        annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        annotationProcessor 'net.java.dev.jna:jna-platform:5.13.0'
        compileOnly('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
            transitive = false
        }
        patchedMinecraft 'me.eigenraven.java8unsupported:java-8-unsupported-shim:1.0.0'
    }
}

def mcmodInfoId = propertyString('mod_id')
def mcmodInfoName = propertyString('mod_name')
def mcmodInfoVersion = propertyString('mod_version')

processResources {
    inputs.property 'mod_id', mcmodInfoId
    inputs.property 'mod_name', mcmodInfoName
    inputs.property 'mod_version', mcmodInfoVersion

    filesMatching('mcmod.info') {
        expand(
                'mod_id': mcmodInfoId,
                'mod_name': mcmodInfoName,
                'mod_version': mcmodInfoVersion,
        )
    }
}

tasks.named('jar', Jar) {
    if (useJava25) {
        dependsOn ':core:classes'
        from project(':core').sourceSets.main.output
        exclude 'com/eminus/client/gpu/opengl/GameHandles.class'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from {
            def libs = configurations.vetusEmbeddedLibs.files
            libs.addAll(project(':core').configurations.runtimeClasspath.files)
            libs.collect { dep ->
                dep.isDirectory() ? dep : zipTree(dep)
            }
        } {
            exclude 'META-INF/MANIFEST.MF'
            exclude 'META-INF/*.SF'
            exclude 'META-INF/*.DSA'
            exclude 'META-INF/*.RSA'
            exclude 'META-INF/LICENSE*'
            exclude 'META-INF/NOTICE*'
            exclude 'META-INF/versions/**'
            exclude 'module-info.class'
        }
    }
}

tasks.named('assemble').configure {
    if (useJava25) {
        dependsOn ':core:classes'
    }
}

def vetusJarRequiredCoreClasses = [
        'com/eminus/Eminus.class',
        'com/eminus/geom/Face.class',
        'com/eminus/ingest/IngestTrigger.class',
        'com/eminus/ingest/port/ChunkColumnSink.class',
        'com/eminus/ingest/port/ColumnRef.class',
        'com/eminus/ingest/SectionPyramid.class',
        'com/eminus/ingest/SectionSliceConverter.class',
        'com/eminus/ingest/PyramidDownsampler.class',
        'com/eminus/render/port/FarLayerEnvironment.class',
        'com/eminus/client/gpu/RenderThreadGuard.class',
        'com/eminus/client/frame/GameFrame.class',
        'com/eminus/cell/CellStates.class',
        'com/eminus/cell/DictionaryStateTable.class',
]

def vetusJarTask = tasks.named('jar', Jar)

tasks.register('verifyVetusJarContents') {
    if (!useJava25) {
        enabled = false
        return
    }
    dependsOn vetusJarTask
    def jarArchive = vetusJarTask.flatMap { it.archiveFile }
    def coreClassesDirProvider = project(':core').layout.buildDirectory.dir('classes/java/main')
    inputs.file(jarArchive)
    inputs.dir(coreClassesDirProvider)
    doLast {
        def jarFile = jarArchive.get().asFile
        def jarEntries = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().collect { it.name }.toSet()
        }

        def missingRequired = vetusJarRequiredCoreClasses.findAll { !jarEntries.contains(it) }
        if (!missingRequired.isEmpty()) {
            throw new GradleException(
                    "Vetus jar ${jarFile.name} is missing required core classes: ${missingRequired}")
        }

        def coreClassesDir = coreClassesDirProvider.get().asFile
        if (!coreClassesDir.isDirectory()) {
            throw new GradleException("Core classes directory missing: ${coreClassesDir}")
        }

        def missingCore = []
        coreClassesDir.eachFileRecurse { file ->
            if (!file.name.endsWith('.class')) {
                return
            }
            def entry = coreClassesDir.toPath().relativize(file.toPath()).toString().replace(File.separator, '/')
            if (!jarEntries.contains(entry)) {
                missingCore << entry
            }
        }
        if (!missingCore.isEmpty()) {
            throw new GradleException(
                    "Vetus jar ${jarFile.name} is missing ${missingCore.size()} core classes, first: ${missingCore.take(5)}")
        }

        def forbiddenPrefixes = ['net/minecraft/', 'net/minecraftforge/']
        def leaked = jarEntries.findAll { name ->
            forbiddenPrefixes.any { prefix -> name.startsWith(prefix) && name.endsWith('.class') }
        }
        if (!leaked.isEmpty()) {
            throw new GradleException("Vetus jar must not bundle Minecraft/loader classes: ${leaked.take(5)}")
        }
    }
}

tasks.named('build').configure {
    if (useJava25) {
        dependsOn tasks.named('verifyVetusJarContents')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (propertyBool('use_modern_java_syntax') && !useJava25) {
        if (name in ['compileMcLauncherJava', 'compilePatchedMcJava']) {
            return
        }
        sourceCompatibility = '17'
        options.release.set(8)
        javaCompiler.set(javaToolchains.compilerFor {
            languageVersion.set(JavaLanguageVersion.of(16))
            vendor.set(JvmVendorSpec.AZUL)
        })
    }
}
