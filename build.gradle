// Aggregator: the mod is built by the loader subprojects — 'common' (vanilla-only code and resources),
// 'neoforge' and 'fabric' (entrypoint, platform glue, loader jar) — and merged here into the one jar that ships.
plugins {
    id 'base'
    id 'idea'
    id 'net.ltgt.errorprone' apply false
}

// Static analysis on every compile task, tests included: a warning fails the build. Deprecation stays off because an
// API deprecated on one game line is still the only one on another.
subprojects {
    pluginManager.withPlugin('java') {
        pluginManager.apply('net.ltgt.errorprone')

        dependencies {
            errorprone "com.google.errorprone:error_prone_core:${errorprone_version}"
            errorprone "com.uber.nullaway:nullaway:${nullaway_version}"
        }

        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += ['-Xlint:all,-deprecation,-processing,-classfile,-serial', '-Werror']
            // Shadowed fields and injected handlers read as unused or unreachable outside the mixin runtime.
            options.errorprone.excludedPaths = '.*/mixin/.*'
            // Format strings are constants by the workspace's own rule.
            options.errorprone.disable('InlineFormatString')
            if (name == 'compileJava') {
                options.errorprone.error('NullAway')
                options.errorprone.option('NullAway:AnnotatedPackages', 'com.eminus')
            } else {
                options.errorprone.disable('NullAway')
            }
        }
    }
}

// The loader jars are this script's inputs, so their tasks have to exist before it names them.
evaluationDependsOnChildren()

def modId = 'eminus'
def buildSuffix = findProperty("${modId}_build")
def withBuildSuffix = { baseVersion -> buildSuffix ? "${baseVersion}-${buildSuffix}" : baseVersion }

def neoforgeJar = project(':neoforge').tasks.named('jar', Jar)
def fabricJar = project(':fabric').tasks.named('jar', Jar)

def fabricNestedDir = 'META-INF/jars/'
def sqliteJdbcFileName = "sqlite-jdbc-${sqlite_jdbc_version}.jar"
def sqliteJdbcEntry = fabricNestedDir + sqliteJdbcFileName
def sqliteNativeRoot = 'org/sqlite/native/'
def droppedSqliteNatives = ['Linux/x86', 'Linux-Musl/x86', 'FreeBSD/x86', 'Windows/x86', 'Windows/armv7'] as Set
def keptSqliteNatives = ['Linux/x86_64', 'Linux/aarch64', 'Linux/arm', 'Linux/armv6', 'Linux/armv7', 'Linux/ppc64',
        'Linux/riscv64', 'Linux-Musl/x86_64', 'Linux-Musl/aarch64', 'FreeBSD/x86_64', 'FreeBSD/aarch64', 'Mac/x86_64',
        'Mac/aarch64', 'Windows/x86_64', 'Windows/aarch64'] as Set

// The output keeps the nested jar's file name: both loaders find it by that path alone.
def slimSqliteJdbc = tasks.register('slimSqliteJdbc') {
    def source = fabricJar.flatMap { it.archiveFile }
    def target = layout.buildDirectory.file("slim-sqlite-jdbc/${sqliteJdbcFileName}")
    inputs.file(source)
    inputs.property('droppedSqliteNatives', droppedSqliteNatives)
    inputs.property('keptSqliteNatives', keptSqliteNatives)
    outputs.file(target)

    doLast {
        def nativeOf = { String name ->
            def parts = name.substring(sqliteNativeRoot.length()).split('/')
            parts.length >= 2 ? "${parts[0]}/${parts[1]}".toString() : null
        }
        def unknown = [] as Set
        new java.util.zip.ZipFile(source.get().asFile).withCloseable { outer ->
            def nested = outer.getEntry(sqliteJdbcEntry)
            if (nested == null) {
                throw new GradleException("The Fabric build nests no ${sqliteJdbcEntry}")
            }
            new java.util.zip.ZipInputStream(outer.getInputStream(nested)).withCloseable { input ->
                new java.util.zip.ZipOutputStream(new FileOutputStream(target.get().asFile)).withCloseable { output ->
                    for (def entry = input.nextEntry; entry != null; entry = input.nextEntry) {
                        def nativeDir = entry.name.startsWith(sqliteNativeRoot) ? nativeOf(entry.name) : null
                        if (nativeDir in droppedSqliteNatives) {
                            continue
                        }
                        if (nativeDir != null && !(nativeDir in keptSqliteNatives)) {
                            unknown << nativeDir
                        }
                        def copy = new java.util.zip.ZipEntry(entry.name)
                        copy.time = entry.time
                        output.putNextEntry(copy)
                        output << input
                        output.closeEntry()
                    }
                }
            }
        }
        if (unknown) {
            throw new GradleException("sqlite-jdbc ${sqlite_jdbc_version} carries natives neither kept nor dropped: ${unknown}")
        }
    }
}

// The one file that ships, for both loaders: 26.x is unobfuscated, so one set of classes serves either, and each loader
// reads only its own metadata. The manifest is the Fabric build's, whose Fabric-Mixin attributes Fabric Loader reads;
// shared classes are the NeoForge build's, which are common's own output.
tasks.register('modJar', Zip) {
    archiveFileName = "${modId}-${withBuildSuffix("${eminus_version}+mc${minecraft_version}")}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def manifestPath = 'META-INF/MANIFEST.MF'
    def jarJarDir = 'META-INF/jarjar/'
    def neoforgeFile = neoforgeJar.flatMap { it.archiveFile }
    def fabricFile = fabricJar.flatMap { it.archiveFile }
    def entriesOf = { jar ->
        new java.util.zip.ZipFile(jar.asFile).withCloseable { zip -> zip.entries().collect { it.name }.toSet() }
    }
    // Which build a shared path comes from is stated, never left to the order the specs are walked in.
    def neoforgeEntries = neoforgeFile.map(entriesOf)
    def fabricEntries = fabricFile.map(entriesOf)

    // Both builds nest the same libraries, 12 MB of sqlite-jdbc among them, and the file carries one copy: the Fabric
    // build's, because Fabric Loader wants the fabric.mod.json Loom wrote into it, while FML opens whatever path the
    // JarJar metadata names.
    doFirst {
        def unmatched = neoforgeEntries.get()
                .findAll { it.startsWith(jarJarDir) && it.endsWith('.jar') }
                .collect { fabricNestedDir + it.substring(jarJarDir.length()) }
                .findAll { !fabricEntries.get().contains(it) }
        if (unmatched) {
            throw new GradleException("The NeoForge build nests libraries the Fabric build lacks: ${unmatched}")
        }
    }

    from(zipTree(neoforgeFile)) {
        exclude manifestPath
        exclude "${jarJarDir}*.jar"
        filesMatching("${jarJarDir}metadata.json") {
            filter { line -> line.replace(jarJarDir, fabricNestedDir) }
        }
    }
    from(zipTree(fabricFile)) {
        exclude { element ->
            def path = element.relativePath.pathString
            path == sqliteJdbcEntry || (path != manifestPath && neoforgeEntries.get().contains(path))
        }
    }
    from(slimSqliteJdbc) {
        into fabricNestedDir
    }
}
